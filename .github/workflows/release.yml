# 发布（设计文档 O.03 §6.1）：推送 v* 标签时运行，产出未签名的预览版（O-R6），作为"预发布"上传到本仓库的 GitHub Releases。
# 先在三个能运行的平台上冒烟（第 7 步），都通过后在 ubuntu 上打两遍、比较 SHA256SUMS.txt（S.12-R6），再上传。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  smoke:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - run: go run ./tools/build -preview
      - name: 冒烟（O.03 §6.4）
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          go run ./tools/release -smoke "bin/anydoor$exe"

  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - name: 上一个版本的大小（有就比较，O.03 §6.3）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          prev=$(gh release list --limit 20 --json tagName --jq ".[] | select(.tagName != \"$GITHUB_REF_NAME\") | .tagName" | head -n 1 || true)
          if [ -n "$prev" ]; then
            gh release download "$prev" --pattern sizes.txt --dir "$RUNNER_TEMP/prev" || true
          fi
      - name: 第一遍
        run: |
          prev=""
          if [ -f "$RUNNER_TEMP/prev/sizes.txt" ]; then prev="$RUNNER_TEMP/prev/sizes.txt"; fi
          go run ./tools/release -version-check -out dist/a ${prev:+-prev-sizes "$prev"}
      - name: 第二遍（可复现：两遍的 SHA256SUMS.txt 必须相同）
        run: |
          go run ./tools/release -version-check -out dist/b
          diff dist/a/SHA256SUMS.txt dist/b/SHA256SUMS.txt
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          retention-days: 14
      - name: 发布说明
        run: |
          base="${GITHUB_REF_NAME#v}"
          tar -xzf dist/a/anydoor-*-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          bin=$(ls -d "$RUNNER_TEMP"/anydoor-*-linux-amd64)/anydoor
          {
            echo "**未签名的预览版，只用于内部试用。**"
            echo
            echo "- Windows：首次运行时 SmartScreen 可能拦截，选\"更多信息 → 仍要运行\"。"
            echo "- macOS：首次运行被拦截时，在\"系统设置 → 隐私与安全性\"里允许，或在终端执行 \`xattr -d com.apple.quarantine anydoor\`。"
            echo "- 停止：在运行它的终端窗口按 Ctrl+C，或关闭这个窗口。"
            echo
            echo '```'
            "$bin" --version
            echo '```'
            echo
            # 本版本那一节；没有就用"未发布"那一节（和归档里的 CHANGELOG.md 一致）
            if grep -q "^## \[$base\]" CHANGELOG.md; then
              awk -v h="## [$base]" 'index($0, h) == 1 { on = 1; print; next } /^## \[/ { on = 0 } on' CHANGELOG.md
            else
              awk 'index($0, "## [未发布]") == 1 { on = 1; print; next } /^## \[/ { on = 0 } on' CHANGELOG.md
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: 上传为预发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "Anywhere Door ${GITHUB_REF_NAME#v}（预览版）" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/a/*.zip dist/a/*.tar.gz dist/a/SHA256SUMS.txt dist/a/sizes.txt
