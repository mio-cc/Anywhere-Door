# CI（设计文档 O.02 §4.2）。合并流程、哪些任务已到期（红了是缺陷）、本地复现的命令见 docs/ci.md。
# 第三方 Actions 只用 actions/* 官方的几个，固定到提交哈希，行末注释是版本标签（S.12-R6）。
# 不配置任何密钥（O-R4）；PR 的标题、说明等经环境变量传给命令，不在 run 里直接展开（防注入）。
name: ci

on:
  push:
    branches: [main, "ci-drill/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # tools/build、tools/relay 的测试会在临时仓库里提交
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@example.invalid
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@example.invalid
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  gen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - id: pnpm
        run: echo "store=$(pnpm -C web store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm -C web install --frozen-lockfile
      - run: go run ./tools/gen
      - name: 生成物与仓库一致
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "生成物和提交的不一致：运行 go run ./tools/gen 后提交结果（INV-17）"
            exit 1
          fi

  go-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            go test ./... -count=1 -race -coverpkg=./... -coverprofile=cover.out 2>&1 | tee go-test.log
          else
            go test ./... -count=1 2>&1 | tee go-test.log
          fi
      - name: 覆盖率报告（M0 不设门槛，P.09 K243）
        if: runner.os == 'Linux'
        run: go run ./tools/ci/cover cover.out
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-${{ matrix.os }}
          path: |
            go-test.log
            cover.out
          retention-days: 14

  go-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: 安装 golangci-lint（版本见 tools/versions.txt）
        run: |
          v=$(awk '$1 == "golangci-lint" { print $2 }' tools/versions.txt)
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v$v"
      - run: golangci-lint run ./...
      - run: go run ./tools/depcheck
      - run: go run ./tools/lint/quirkscheck
      - run: go run ./tools/lint/typenamecheck

  web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - id: pnpm
        run: echo "store=$(pnpm -C web store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm -C web install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: pnpm -C web lint
      - run: pnpm -C web test
      - if: runner.os == 'Linux'
        run: pnpm -C web build
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-report-${{ matrix.os }}
          path: |
            web/.test
            web/test-results
          retention-days: 14

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 版本号要 git describe（O.01 §4.2）
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: go run ./tools/build -preview
      - name: 冒烟（O.03 §6.4）
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          # 冒烟失败时会把 anydoor 的标准错误（日志）一起打印出来，存进 smoke.log 供上传（O.02 §6.2）
          go run ./tools/release -smoke "bin/anydoor$exe" 2>&1 | tee smoke.log
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anydoor-linux
          path: bin/anydoor
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log-${{ matrix.os }}
          path: smoke.log
          retention-days: 14

  e2e:
    # M1（W.12 落地起）到期；现在调用的是桩脚本，红了只记录（docs/ci.md §2）
    # 用 build 任务的 Linux 产物（O.02 §4.2）
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anydoor-linux
          path: bin
      - run: chmod +x bin/anydoor # 产物不保留可执行权限
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web test:e2e
      - run: pnpm -C web test:visual
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            web/test-results
            web/playwright-report
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks 扫全部历史（S.12-R2）
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - name: 密钥扫描（gitleaks，全部历史）
        run: |
          v=$(awk '$1 == "gitleaks" { print $2 }' tools/versions.txt)
          go run "github.com/zricethezav/gitleaks/v8@v$v" git --redact --verbose .
      - name: 漏洞扫描（govulncheck）
        run: |
          v=$(awk '$1 == "govulncheck" { print $2 }' tools/versions.txt)
          go run "golang.org/x/vuln/cmd/govulncheck@v$v" ./...
      - run: pnpm -C web audit --audit-level high --prod
      - name: 依赖清单（G.10-R1）
        run: go run ./tools/ci/deps

  pr-meta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: 提交信息、文件白名单、变更日志
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          status=0
          go run ./tools/ci/commitcheck -title "$PR_TITLE" -base "$BASE_SHA" -head "$HEAD_SHA" || status=1
          go run ./tools/ci/allowlist -branch "$PR_BRANCH" -body "$RUNNER_TEMP/pr-body.md" -base "$BASE_SHA" -head "$HEAD_SHA" || status=1
          go run ./tools/ci/changelog -labels "$PR_LABELS" -base "$BASE_SHA" -head "$HEAD_SHA" || status=1
          exit $status
