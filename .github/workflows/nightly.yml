# 每晚任务（设计文档 O.02 §6.3）：北京时间 03:00（UTC 19:00）在 main 上运行。
# 失败时开一个 Issue；每晚任务的失败作为缺陷在 2 个工作日内处理（Q.12）。
name: nightly

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  vuln:
    # 漏洞与密钥扫描：和 ci.yml 的 security 任务相同（S.12-R2：每天一次）
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - run: |
          v=$(awk '$1 == "gitleaks" { print $2 }' tools/versions.txt)
          go run "github.com/zricethezav/gitleaks/v8@v$v" git --redact --verbose .
      - run: |
          v=$(awk '$1 == "govulncheck" { print $2 }' tools/versions.txt)
          go run "golang.org/x/vuln/cmd/govulncheck@v$v" ./...
      - run: pnpm -C web audit --audit-level high --prod
      - run: go run ./tools/ci/deps
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "每晚漏洞扫描失败（$(date -u +%F)）" --label security --body "运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（O.02 §6.3）"

  reproducible-build:
    # 同一提交在两个干净的运行器上各构建一次（S.12-R6、O01-T5）
    strategy:
      matrix:
        n: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
      - run: corepack enable
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web build
      - run: go run ./tools/build -preview
      - run: sha256sum bin/anydoor | tee "sum-${{ matrix.n }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sum-${{ matrix.n }}
          path: sum-${{ matrix.n }}.txt
          retention-days: 14

  compare:
    # always()：任一次构建失败时也要运行，才能开 Issue（O.02 §6.3）
    needs: reproducible-build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # 构建失败时没有产物，下一步会判失败
        with:
          pattern: sum-*
          merge-multiple: true
      - name: 两次构建都成功、anydoor 哈希相同
        env:
          BUILD_RESULT: ${{ needs.reproducible-build.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ] || [ ! -f sum-a.txt ] || [ ! -f sum-b.txt ]; then
            echo "可复现构建的两次构建没有都成功（结果：$BUILD_RESULT）"
            exit 1
          fi
          cat sum-a.txt sum-b.txt
          [ "$(cut -d' ' -f1 sum-a.txt)" = "$(cut -d' ' -f1 sum-b.txt)" ]
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "每晚可复现构建失败（$(date -u +%F)）" --body "同一提交的两次构建有一次失败，或两次的 anydoor 哈希不同。运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}（O.02 §6.3）"
