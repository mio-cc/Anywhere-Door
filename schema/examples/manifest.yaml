# 示例清单（C.01-R22）：schema/examples/ 下的每个示例文档都登记在这里，写明按哪个 schema 校验、应当通过还是失败。
# 测试向量（文件名以 _vectors.json 结尾）不登记。每个 C 叶子把自己的示例追加在后面。
#
# file:     相对 schema/examples/ 的路径
# schema:   按哪个 schema 校验，可以带 #/$defs/…
# valid:    true 应当通过，false 应当失败
# error_at: valid 为 false 时必填：期望的报错位置（JSON Pointer，整个文档写 ""）；实际报错位置都必须是它或它下面
# diag:     只用于 semantic/ 下的文件（C.01-R23）：schema 通过，但图检查应当报这个诊断码

# C.01 公共定义
- file: invalid/actor_system_kind.json
  schema: common.schema.json#/$defs/Actor
  valid: false
  error_at: /kind
- file: invalid/mandate_anchor_path.json
  schema: common.schema.json#/$defs/MandateMount
  valid: false
  error_at: /anchor

# C.06.05 位置 Loc
- file: loc_loop_executor.json
  schema: common.schema.json#/$defs/Loc
  valid: true
- file: invalid/loc_round_zero.json
  schema: common.schema.json#/$defs/Loc
  valid: false
  error_at: /iter/round

# C.11 错误响应与诊断
- file: errors/graph_conflict.json
  schema: errors.schema.json#/$defs/ErrorResponse
  valid: true
- file: errors/diag_v12_warn.json
  schema: errors.schema.json#/$defs/Diag
  valid: true
- file: invalid/error_unknown_code.json
  schema: errors.schema.json#/$defs/ErrorResponse
  valid: false
  error_at: /error/code
- file: invalid/diag_code_v99.json
  schema: errors.schema.json#/$defs/Diag
  valid: false
  error_at: /code

