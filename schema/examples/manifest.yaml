  valid: true
  diag: V05

# C.02.04 子图与嵌套
- file: invalid/subgraph_ref_bad_version.json
  schema: graph.schema.json
  valid: false
  error_at: /root/nodes/0/ref/version
- file: semantic/loop_without_children.json  # 循环必须带子图（C.02.04 §9 验收 1）
  schema: graph.schema.json
  valid: true
  diag: V11
- file: semantic/subgraph_without_exit.json  # 子图只有入口没有出口（§9 验收 2）
  schema: graph.schema.json
  valid: true
  diag: V11
- file: semantic/nesting_depth_9.json  # 嵌套到第 9 层，超过上限 8 层：error（§9 验收 3）
  schema: graph.schema.json
  valid: true
  diag: V12
- file: semantic/nesting_depth_5.json  # 嵌套到第 5 层，超过 4 层：warn（§9 验收 3）
  schema: graph.schema.json
  valid: true
  diag: V12

# C.02.05 视图元数据
- file: graph_ui_unknown.json  # 节点 ui 里有未知键 x_extra，要原样保留
