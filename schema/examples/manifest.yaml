- file: graph_loop.json
  schema: graph.schema.json
  valid: true
- file: invalid/graph_missing_root.json
  schema: graph.schema.json
  valid: false
  error_at: ""
- file: invalid/graph_version_negative.json
  schema: graph.schema.json
  valid: false
  error_at: /version
- file: invalid/graph_branch_feature.json
  schema: graph.schema.json
  valid: false
