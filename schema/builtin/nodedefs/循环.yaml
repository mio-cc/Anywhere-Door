# 原子节点定义（C.03.01；端口按 §6，参数按 E.14.09 的参数表，写法按 §6.1）。执行器叶子要改参数时只改这一份（P.09 K215）。
name: 循环
version: "1.0"
kind: atomic
category: 控制
description: 按轮次或事件反复执行子图，直到满足退出条件；唯一能成环的节点
impl: { type: builtin }
ports:
  inputs:
    init: { type: "$T", label: 初始值 }
  outputs:
    final:   { type: "$T", label: 最终结果 }
    summary: { type: 简报@1, label: 简报 }
params:
  trigger:         { type: enum, label: 触发方式, enum: [rounds, event], enum_labels: { rounds: 按轮次, event: 按事件 }, default: rounds, ui: { group: 常用 } }
  max_rounds:      { type: integer, label: 最多轮数, min: 1, max: 50, step: 1, default: 5, ui: { group: 常用 } }
  exits:           { type: expr, label: 退出条件, default: "achieved == true" }
  stall_metric:    { type: expr, label: 进展指标, help: "无进展检测，如 len(gap.gaps)" }
  stall_rounds:    { type: integer, label: 无进展几轮就停, min: 1, max: 10, step: 1, default: 2 }
  carry_fields:    { type: object, label: 带进下一轮的字段, help: 不填时全部带上, schema: { type: array, items: { type: string } }, ui: { widget: code } }
  carry_budget:    { type: number, label: 轮间携带比例, help: 占窗口比例上限, min: 0, max: 1, step: 0.05, default: 0.2 }
  idle_timeout_ms: { type: integer, label: 空闲超时, unit: ms, min: 1, help: 按事件时多久没有事件就结束, ui: { show_if: "trigger == 'event'" } }
  queue:           { type: object, label: 事件队列, help: 按事件时的队列策略（优先级、合并键）, ui: { show_if: "trigger == 'event'" } }
type_vars: { T: "input:init" }
container: required
