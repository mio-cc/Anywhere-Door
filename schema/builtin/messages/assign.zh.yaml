# 端口兼容规则的提示文案（C.04.02 §5、R2）：恰好 C1、C2、C4、C6、C8、C10 六条（G.16）。
# 变量：{src}、{dst} 是完整的类型写法；{dst_name} 是不带版本的名称；{producer} 是产出节点类型。
C1: 任意类型只能接到「任意」端口。先接一个设置了输出类型的 Agent 来转换
C2: "{dst_name}只能来自{producer}节点"
C4: "{src} 和 {dst} 版本不同，且没有转换方法"
C6: 父类型不能接到子类型端口
C8: 单个值不能接到列表端口，中间加一个汇合节点
C10: "{src} 不能接到 {dst}"
