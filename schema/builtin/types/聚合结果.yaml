name: 聚合结果
major: 1
minor: 0
description: 聚合算子 group、group_ratio 的输出
fields:
  - name: groups
    type: "列表[object]"
    label: 分组
    required: true
    fields:
      - { name: label,   type: string, label: 组名, required: true }
